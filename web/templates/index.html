<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCADA Veri İzleme</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --plane: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --surface-1: #1a1a19;
      --plane: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --surface-1: #1a1a19;
    --plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .spacer { flex: 1; }

  button.ghost {
    font: inherit; color: var(--text-secondary); background: transparent;
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 11px; cursor: pointer;
  }
  button.ghost:hover { background: var(--surface-1); color: var(--text-primary); }

  .devbar { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0 20px; }
  .dev {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 13px; font-size: 13px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .tile .k { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .v { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .tile .u { font-size: 13px; font-weight: 400; color: var(--text-secondary); margin-left: 3px; }
  .tile .lim { font-size: 11px; color: var(--text-muted); margin-top: 5px; font-variant-numeric: tabular-nums; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 12px; font-weight: 500; color: var(--text-primary);
  }
  .alarm-row .badge { white-space: normal; }
  .badge svg { flex: none; }

  h2 { font-size: 14px; font-weight: 600; margin: 30px 0 12px; }

  .alarms { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .alarm-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; border-top: 1px solid var(--border); font-size: 13px;
  }
  .alarm-row:first-child { border-top: none; }
  .alarm-row .when { margin-left: auto; color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .empty { padding: 18px 16px; color: var(--text-secondary); font-size: 13px; }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 15px 16px 8px; position: relative;
  }
  .card h3 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  .card .cap { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
  svg { display: block; width: 100%; overflow: visible; }
  .tick { fill: var(--text-muted); font-size: 10px; font-variant-numeric: tabular-nums; }

  .tip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 9px; font-size: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.10); transition: opacity .1s; white-space: nowrap;
  }
  .tip b { font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 16px; border-top: 1px solid var(--border); }
  th { color: var(--text-secondary); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  details { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }
  summary { padding: 12px 16px; cursor: pointer; font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>SCADA Veri İzleme</h1>
    <span class="sub" id="clock">—</span>
    <span class="spacer"></span>
    <button class="ghost" id="theme">Tema</button>
  </header>

  <div class="devbar" id="devbar"></div>

  <div class="tiles" id="tiles"></div>

  <h2>Aktif Alarmlar</h2>
  <div class="alarms" id="alarms"><div class="empty">Yükleniyor…</div></div>

  <h2>Trendler <span class="sub" style="font-weight:400">— son 6 saat</span></h2>
  <div class="charts" id="charts"></div>

  <h2>Veri Tablosu</h2>
  <details>
    <summary>Anlık değerleri tablo olarak göster</summary>
    <table id="table"><tbody></tbody></table>
  </details>

</div>

<script>
const TREND_TAGS = ["tank_level", "flow_rate", "discharge_pressure", "motor_current"];
const STATUS_ICONS = {
  good:     '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="var(--good)"/><path d="M3.6 6.2l1.7 1.7 3.1-3.5" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>',
  warning:  '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1l5 9.5H1z" fill="var(--warning)"/><path d="M6 4.4v2.6" stroke="#0b0b0b" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="8.7" r=".8" fill="#0b0b0b"/></svg>',
  critical: '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="var(--critical)"/><path d="M6 3.3v3.1" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="6" cy="8.5" r=".85" fill="#fff"/></svg>',
  offline:  '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="var(--text-muted)" stroke-width="1.5"/><path d="M3.7 3.7l4.6 4.6" stroke="var(--text-muted)" stroke-width="1.5"/></svg>'
};

const fmt = (v, d = 1) => Number(v).toLocaleString("tr-TR", { minimumFractionDigits: d, maximumFractionDigits: d });
const clock = (iso) => new Date(iso).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

document.getElementById("theme").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", now === "dark" ? "light" : "dark");
  drawAllCharts();
};

/* ------------------------------------------------------------------ tiles */

function statusOf(v) {
  if (v.kind === "discrete") return null;
  if (v.max_warn != null && v.value > v.max_warn) return "warning";
  if (v.min_warn != null && v.value < v.min_warn) return "warning";
  return null;
}

function renderTiles(values) {
  const shown = ["tank_level", "flow_rate", "discharge_pressure", "motor_current", "total_volume", "pump_running"];
  const byTag = Object.fromEntries(values.map(v => [v.tag, v]));
  document.getElementById("tiles").innerHTML = shown.map(tag => {
    const v = byTag[tag];
    if (!v) return "";
    if (v.kind === "discrete") {
      const on = v.value >= 0.5;
      return `<div class="tile"><div class="k">${v.label}</div>
        <div class="v" style="font-size:19px;padding-top:6px">
          <span class="badge">${on ? STATUS_ICONS.good : STATUS_ICONS.offline}${on ? "Çalışıyor" : "Durdu"}</span>
        </div></div>`;
    }
    const st = statusOf(v);
    const digits = v.unit === "m3" ? 0 : (v.unit === "bar" ? 2 : 1);
    let lim = "";
    if (v.max_warn != null) lim = `üst limit ${v.max_warn} ${v.unit}`;
    else if (v.min_warn != null) lim = `alt limit ${v.min_warn} ${v.unit}`;
    return `<div class="tile">
      <div class="k">${v.label}</div>
      <div class="v">${fmt(v.value, digits)}<span class="u">${v.unit}</span></div>
      <div class="lim">${st ? `<span class="badge">${STATUS_ICONS.warning} limit aşıldı</span>` : lim}</div>
    </div>`;
  }).join("");
}

/* ----------------------------------------------------------------- alarms */

function renderAlarms(open, history) {
  const el = document.getElementById("alarms");
  if (!open.length) {
    el.innerHTML = `<div class="empty"><span class="badge">${STATUS_ICONS.good} Aktif alarm yok</span>` +
      (history.length ? ` — son kayıt: ${history[0].message} (${clock(history[0].raised_at)})` : "") + `</div>`;
    return;
  }
  el.innerHTML = open.map(a => {
    const icon = a.severity === "high" ? STATUS_ICONS.critical : STATUS_ICONS.warning;
    return `<div class="alarm-row"><span class="badge">${icon}${a.message}</span>
            <span class="when">${clock(a.raised_at)}</span></div>`;
  }).join("");
}

/* ---------------------------------------------------------------- devices */

function renderDevices(devices) {
  document.getElementById("devbar").innerHTML = devices.map(d => `
    <div class="dev">
      <span class="dot" style="background:${d.online ? "var(--good)" : "var(--critical)"}"></span>
      <b style="font-weight:600">${d.label}</b>
      <span style="color:var(--text-secondary)">${d.online ? "bağlı" : "bağlantı yok"}</span>
    </div>`).join("");
}

/* ----------------------------------------------------------------- charts */

const chartData = {};

function niceScale(min, max) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const step = Math.pow(10, Math.floor(Math.log10(span / 3)));
  const mult = [1, 2, 2.5, 5, 10].find(m => span / (step * m) <= 4) || 10;
  const s = step * mult;
  return { lo: Math.floor(min / s) * s, hi: Math.ceil(max / s) * s, step: s };
}

function drawChart(card, data) {
  const W = card.clientWidth - 32, H = 150;
  const P = { t: 8, r: 8, b: 20, l: 42 };
  const pts = data.points;
  const svg = card.querySelector("svg");
  const tip = card.querySelector(".tip");

  if (pts.length < 2) { svg.innerHTML = `<text class="tick" x="0" y="20">veri bekleniyor…</text>`; return; }

  const vals = pts.map(p => p.value);
  const { lo, hi, step } = niceScale(Math.min(...vals), Math.max(...vals));
  const x = i => P.l + (i / (pts.length - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);

  let grid = "", ticks = "";
  for (let g = lo; g <= hi + 1e-9; g += step) {
    ticks += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--grid)" stroke-width="1"/>`;
    grid += `<text class="tick" x="${P.l - 7}" y="${y(g) + 3}" text-anchor="end">${fmt(g, step < 1 ? 2 : 0)}</text>`;
  }

  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length - 1).toFixed(1)},${y(lo)}L${x(0).toFixed(1)},${y(lo)}Z`;
  const gid = "g" + Math.abs(hashCode(data.tag));

  const first = clock(pts[0].ts), last = clock(pts[pts.length - 1].ts);

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.innerHTML = `
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="var(--series-1)" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="var(--series-1)" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks}${grid}
    <line x1="${P.l}" x2="${W - P.r}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--axis)" stroke-width="1"/>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="var(--series-1)" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1].value)}" r="4"
            fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>
    <text class="tick" x="${P.l}" y="${H - 5}">${first}</text>
    <text class="tick" x="${W - P.r}" y="${H - 5}" text-anchor="end">${last}</text>
    <line class="cross" x1="0" x2="0" y1="${P.t}" y2="${y(lo)}" stroke="var(--axis)" stroke-width="1" opacity="0"/>
    <circle class="hov" r="4.5" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2" opacity="0"/>
    <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" class="hit"/>`;

  const cross = svg.querySelector(".cross"), hov = svg.querySelector(".hov");
  svg.querySelector(".hit").onmousemove = ev => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W / rect.width);
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((px - P.l) / (W - P.l - P.r) * (pts.length - 1))));
    const p = pts[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", "1");
    hov.setAttribute("cx", x(i)); hov.setAttribute("cy", y(p.value)); hov.setAttribute("opacity", "1");
    tip.style.opacity = 1;
    tip.innerHTML = `<b>${fmt(p.value, 2)}</b> ${data.unit}<br><span style="color:var(--text-secondary)">${clock(p.ts)}</span>`;
    const left = 16 + (x(i) / W) * rect.width;
    tip.style.left = Math.min(rect.width - 110, Math.max(8, left - 45)) + "px";
    tip.style.top = (y(p.value) * (rect.height / H) + 34) + "px";
  };
  svg.querySelector(".hit").onmouseleave = () => {
    cross.setAttribute("opacity", "0"); hov.setAttribute("opacity", "0"); tip.style.opacity = 0;
  };
}

function hashCode(s) { let h = 0; for (const c of s) h = (h << 5) - h + c.charCodeAt(0) | 0; return h; }

function drawAllCharts() {
  document.querySelectorAll(".card[data-tag]").forEach(card => {
    const d = chartData[card.dataset.tag];
    if (d) drawChart(card, d);
  });
}
window.addEventListener("resize", drawAllCharts);

/* ------------------------------------------------------------------ table */

function renderTable(values) {
  document.querySelector("#table tbody").innerHTML =
    `<tr><th>Etiket</th><th>Değer</th><th>Birim</th><th>Zaman</th></tr>` +
    values.map(v => `<tr>
      <td>${v.label}</td>
      <td class="num">${v.kind === "discrete" ? (v.value >= .5 ? "1" : "0") : fmt(v.value, 2)}</td>
      <td>${v.unit || "—"}</td>
      <td class="num">${clock(v.ts)}</td></tr>`).join("");
}

/* ------------------------------------------------------------------- loop */

let device = null;

async function refresh() {
  try {
    const snap = await (await fetch("/api/snapshot")).json();
    if (!device && snap.devices.length) device = snap.devices[0].name;
    renderDevices(snap.devices);
    renderTiles(snap.values);
    renderAlarms(snap.alarms, snap.alarm_history);
    renderTable(snap.values);
    document.getElementById("clock").textContent =
      "son güncelleme " + new Date().toLocaleTimeString("tr-TR");

    if (device) {
      const container = document.getElementById("charts");
      if (!container.children.length) {
        container.innerHTML = TREND_TAGS.map(t =>
          `<div class="card" data-tag="${t}"><h3 data-role="title">…</h3>
           <div class="cap" data-role="cap"></div><svg></svg><div class="tip"></div></div>`).join("");
      }
      await Promise.all(TREND_TAGS.map(async t => {
        const d = await (await fetch(`/api/history/${device}/${t}?hours=6`)).json();
        chartData[t] = d;
        const card = container.querySelector(`.card[data-tag="${t}"]`);
        card.querySelector('[data-role="title"]').textContent = d.label;
        const last = d.points.length ? d.points[d.points.length - 1].value : null;
        card.querySelector('[data-role="cap"]').textContent =
          last == null ? "" : `şu an ${fmt(last, 2)} ${d.unit}`;
        drawChart(card, d);
      }));
    }
  } catch (e) {
    console.error("refresh failed", e);
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
